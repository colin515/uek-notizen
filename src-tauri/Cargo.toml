[package]
name = "uek-notizen"
version = "1.2.0"
description = "Eine ruhige, lokale Notiz-App für Schweizer ÜK-Lernende"
authors = ["Colin"]
edition = "2021"

[lib]
name = "uek_notizen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }

