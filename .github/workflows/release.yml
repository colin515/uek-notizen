name: Desktop Builds

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: UEK-Notizen-Windows-x64
          - platform: macos-latest
            artifact: UEK-Notizen-macOS
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: npm run tauri build
      - name: Build universal macOS application
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target universal-apple-darwin
      - name: Create Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "src-tauri/target/release/uek-notizen.exe" -DestinationPath "UEK-Notizen-Windows-x64.zip"
      - name: Create macOS package (ZIP + DMG)
        if: runner.os == 'macOS'
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/ÜK Notizen.app"

          # Ad-hoc signieren (kein Apple Developer Zertifikat nötig)
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          # Quarantäne-Attribut direkt entfernen (verhindert "beschädigt"-Meldung)
          xattr -cr "$APP_PATH"

          # Startskript erstellen – entfernt Quarantäne und öffnet App
          mkdir -p mac-package
          cp -R "$APP_PATH" mac-package/

          cat > "mac-package/⚡ ÜK Notizen starten.command" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          xattr -cr "$DIR/ÜK Notizen.app"
          open "$DIR/ÜK Notizen.app"
          SCRIPT
          chmod +x "mac-package/⚡ ÜK Notizen starten.command"

          cat > "mac-package/LIES MICH - Falls App nicht öffnet.txt" <<'TEXT'
          ╔══════════════════════════════════════════════════╗
          ║         ÜK Notizen – macOS Anleitung             ║
          ╚══════════════════════════════════════════════════╝

          SCHRITT 1: ZIP entpacken (falls noch nicht geschehen)

          SCHRITT 2: App starten
          → Doppelklick auf „ÜK Notizen.app"

          FALLS macOS „beschädigt" meldet:
          → Doppelklick auf „⚡ ÜK Notizen starten.command"
          → Falls auch das blockiert: Rechtsklick → Öffnen → Öffnen klicken

          Das Skript entfernt nur das Quarantäne-Attribut und öffnet die App.
          Die App selbst ist völlig sicher – sie ist nur nicht mit einem
          Apple Developer Zertifikat signiert (kostet 99 USD/Jahr).

          ALTERNATIVE (Terminal):
          xattr -cr ~/Downloads/ÜK\ Notizen.app
          TEXT

          # ZIP erstellen
          ditto -c -k --sequesterRsrc --keepParent mac-package "UEK-Notizen-macOS.zip"

          # DMG erstellen für Drag-and-Drop Installation
          mkdir -p dmg-staging
          cp -R "$APP_PATH" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "ÜK Notizen" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "UEK-Notizen-macOS.dmg"
          xattr -cr "UEK-Notizen-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            UEK-Notizen-*.zip
            UEK-Notizen-*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: UEK-Notizen-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ÜK Notizen v${{ steps.app-version.outputs.version }}
          body: |
            ## 📥 Download

            | System | Datei | Anleitung |
            |--------|-------|-----------|
            | 🪟 Windows | `UEK-Notizen-Windows-x64.zip` | ZIP entpacken → `.exe` starten |
            | 🍎 macOS | `UEK-Notizen-macOS.dmg` | DMG öffnen → App in Programme ziehen |
            | 🍎 macOS (ZIP) | `UEK-Notizen-macOS.zip` | ZIP entpacken → `⚡ ÜK Notizen starten.command` doppelklicken |

            > **macOS Hinweis:** Falls die App als „beschädigt" gemeldet wird, das `.command`-Skript im ZIP verwenden oder im Terminal ausführen:
            > ```
            > xattr -cr ~/Downloads/ÜK\ Notizen.app
            > ```
          files: |
            UEK-Notizen-*.zip
            UEK-Notizen-*.dmg
          fail_on_unmatched_files: true

      - name: Sync website to released version
        env:
          VERSION: ${{ steps.app-version.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          index = Path("website/index.html")
          content = index.read_text()
          content = re.sub(r"\\bAktuelle Version: v\\d+\\.\\d+\\.\\d+", f"Aktuelle Version: v{version}", content)
          content = re.sub(r"/releases/download/v\\d+\\.\\d+\\.\\d+/", f"/releases/download/v{version}/", content)
          content = re.sub(r'downloads\\.js\\?v=[^"]+', f"downloads.js?v={version}", content)
          index.write_text(content)

          downloads = Path("website/downloads.js")
          content = downloads.read_text()
          content = re.sub(r'const preferredRelease = "v\\d+\\.\\d+\\.\\d+";', f'const preferredRelease = "v{version}";', content)
          content = re.sub(r'const safeFallbackRelease = "v\\d+\\.\\d+\\.\\d+";', f'const safeFallbackRelease = "v{version}";', content)
          downloads.write_text(content)

          macos = Path("website/macos.html")
          content = macos.read_text()
          content = re.sub(r"v\\d+\\.\\d+\\.\\d+", f"v{version}", content)
          macos.write_text(content)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html website/downloads.js website/macos.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(website): sync downloads to v${VERSION}"
          git push origin HEAD:main
