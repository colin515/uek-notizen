name: Desktop Builds

on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: UEK-Notizen-Windows-x64
          - platform: macos-latest
            artifact: UEK-Notizen-macOS
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: npm run tauri build
      - name: Build universal macOS application
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target universal-apple-darwin
      - name: Create Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "src-tauri/target/release/uek-notizen.exe" -DestinationPath "UEK-Notizen-Windows-x64.zip"
      - name: Create macOS portable package
        if: runner.os == 'macOS'
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/ÜK Notizen.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          mkdir -p mac-package
          cp -R "$APP_PATH" mac-package/
          cat > "mac-package/ÜK Notizen starten.command" <<'SCRIPT'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          xattr -dr com.apple.quarantine "$DIR/ÜK Notizen.app"
          open "$DIR/ÜK Notizen.app"
          SCRIPT
          chmod +x "mac-package/ÜK Notizen starten.command"
          cat > mac-package/README-MAC.txt <<'TEXT'
          ÜK Notizen starten

          Die App ist ad-hoc signiert. Apple verlangt für Downloads aus dem Internet
          normalerweise eine kostenpflichtige Developer-ID-Signierung und Notarisierung.

          Falls ein Doppelklick auf die App blockiert wird:
          1. Doppelklicke auf „ÜK Notizen starten.command“.
          2. Falls macOS auch dies blockiert: Rechtsklick darauf → Öffnen → Öffnen.

          Das Startskript entfernt nur das Quarantäne-Attribut dieser App und öffnet sie.
          TEXT
          ditto -c -k --sequesterRsrc --keepParent mac-package "UEK-Notizen-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: UEK-Notizen-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: UEK-Notizen-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: ÜK Notizen v1.1.${{ github.run_number }}
          body: |
            Portable Versionen von ÜK Notizen.

            Windows: ZIP entpacken und uek-notizen.exe starten.
            macOS: ZIP entpacken und ÜK Notizen.app öffnen.
          files: UEK-Notizen-*.zip
          fail_on_unmatched_files: true
